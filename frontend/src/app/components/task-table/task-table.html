<div class="bg-canvas border border-line rounded-xl overflow-hidden">

  @if (loading) {
  <div class="p-10 text-center font-sans text-sm text-muted">
    Loading tasks…
  </div>
  }

  @else if (tasks.length === 0) {
  <div class="p-16 text-center flex flex-col items-center gap-4">

    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="8" y="12" width="40" height="32" rx="3" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="8" y="12" width="40" height="8" rx="3" stroke="#7A3E9E" stroke-width="2"/>
      <line x1="16" y1="28" x2="32" y2="28" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="35" x2="28" y2="35" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <div>
      <h2 class="text-base font-display font-semibold text-ink mb-1">No tasks yet</h2>
      <p class="text-sm font-sans text-body">Create your first task to get started.</p>
    </div>

  </div>
  }

  @else {
  <table class="w-full">

    <thead class="bg-gray-50 border-b border-line">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-mono font-medium text-muted uppercase tracking-wide">Title</th>
        <th class="px-6 py-3 text-left text-xs font-mono font-medium text-muted uppercase tracking-wide">Status</th>
        <th class="px-6 py-3 text-left text-xs font-mono font-medium text-muted uppercase tracking-wide">Due Date</th>
        <th class="px-6 py-3 text-left text-xs font-mono font-medium text-muted uppercase tracking-wide">Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (task of tasks; track task.id) {
      <tr class="border-t border-line hover:bg-accent-soft/40 transition-colors">

        <td class="px-6 py-4 font-sans font-medium text-sm text-ink">
          {{ task.title }}
        </td>

        <td class="px-6 py-4">
          <app-status-badge [status]="task.status"></app-status-badge>
        </td>

        <td class="px-6 py-4 font-mono text-xs text-muted">
          {{ task.due_date | date:'dd MMM yyyy' }}
        </td>

        <td class="px-6 py-4 flex gap-3">

          <button
            (click)="edit.emit(task)"
            class="px-3 py-1.5 rounded-lg border border-line text-xs font-sans font-medium text-body hover:bg-accent-soft hover:border-line-warm transition-colors">
            Edit
          </button>

          <button
            (click)="delete.emit(task.id!)"
            class="px-3 py-1.5 rounded-lg border border-line text-xs font-sans font-medium text-muted hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-colors">
            Delete
          </button>

        </td>

      </tr>
      }
    </tbody>

  </table>
  }

</div>
