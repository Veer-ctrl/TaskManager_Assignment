<span
  [class]="
    status === 'Pending'
      ? 'bg-amber-50 text-amber-700 border-amber-200'
      : status === 'Completed'
      ? 'bg-accent-soft text-accent border-accent/25'
      : 'bg-blue-50 text-blue-700 border-blue-200'
  "
  class="inline-flex px-2.5 py-0.5 rounded-md text-xs font-mono font-medium border">
  {{ status }}
</span>
